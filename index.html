<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talrb</title>
    <meta name="description" content="Talrb" />
    <meta name="theme-color" content="#0c1c16" />
    <link rel="icon" href="avatar.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pine: #0c1c16;
        --ink: #f3f6f1;
        --line: #2a4036;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        background: var(--pine);
        color: var(--ink);
        padding: 64px 32px;
      }
      main {
        width: min(768px, 100%);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 40px;
        animation: rise 640ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      img {
        display: block;
        width: 224px;
        height: 224px;
      }
      .name {
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }
      h1 {
        margin: 0;
        font-family: Newsreader, "Iowan Old Style", Palatino, serif;
        font-weight: 400;
        font-size: 3.75rem;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      ::selection {
        background: color-mix(in oklab, #9bb5a4 45%, transparent);
        color: var(--pine);
      }
      @media (min-width: 640px) {
        body { padding: 64px; }
        main {
          flex-direction: row;
          align-items: flex-end;
          gap: 64px;
        }
        img { width: 288px; height: 288px; }
        .name { flex: 1; min-width: 0; margin-bottom: 4px; }
        h1 { font-size: 6rem; }
      }
      @keyframes rise {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        main { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="avatar.png?v=3" alt="" width="1080" height="1080" />
      <div class="name">
        <h1>Talrb</h1>
      </div>
    </main>
  </body>
</html>
